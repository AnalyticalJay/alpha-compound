<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; }
    .slide-container { width: 1280px; min-height: 720px; background: #05080d; color: #f8fafc; font-family: Arial, Helvetica, sans-serif; position: relative; overflow: hidden; }
    .topline { position: absolute; left: 0; top: 0; width: 100%; height: 7px; background: linear-gradient(90deg, #e11d48 0 34%, #0ea5e9 34% 100%); }
    .glow-blue { position: absolute; right: -100px; top: -90px; width: 650px; height: 550px; border-radius: 50%; background: rgba(14,165,233,0.12); filter: blur(10px); }
    .glow-red { position: absolute; left: -120px; bottom: -240px; width: 600px; height: 420px; border-radius: 50%; background: rgba(225,29,72,0.13); }
    .content { position: relative; z-index: 2; display: flex; min-height: 720px; }
    .copy { width: 48%; padding: 96px 0 0 88px; }
    .eyebrow { color: #38bdf8; font-size: 16px; letter-spacing: 3px; font-weight: 700; margin-bottom: 28px; }
    h1 { font-size: 61px; line-height: 0.98; letter-spacing: -2px; max-width: 520px; }
    h1 span { color: #38bdf8; }
    .subtitle { margin-top: 26px; color: #cbd5e1; font-size: 22px; line-height: 1.45; max-width: 470px; }
    .label { margin-top: 42px; display: inline-block; border: 1px solid #e11d48; color: #fda4af; background: rgba(136,19,55,0.35); border-radius: 18px; padding: 13px 20px; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    .right { width: 52%; position: relative; }
    .browser { position: absolute; left: 32px; top: 118px; width: 600px; height: 405px; background: #0b1220; border: 2px solid #334155; border-radius: 22px; box-shadow: 0 25px 55px rgba(0,0,0,0.55); overflow: hidden; }
    .browserbar { height: 38px; background: #121a28; display: flex; align-items: center; gap: 8px; padding-left: 18px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .home-img { width: 596px; height: 363px; object-fit: contain; background: #000; display: block; }
    .phone { position: absolute; right: 14px; top: 250px; width: 206px; height: 408px; padding-top: 19px; border: 4px solid #64748b; border-radius: 32px; background: #060b13; box-shadow: 0 22px 42px rgba(0,0,0,0.62); overflow: hidden; }
    .notch { position: absolute; top: 8px; left: 72px; width: 58px; height: 9px; border-radius: 8px; background: #1e293b; z-index: 2; }
    .mobile-img { width: 198px; height: 370px; object-fit: contain; background: #000; display: block; }
    .footer { position: absolute; left: 88px; bottom: 54px; color: #94a3b8; font-size: 14px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="topline"></div>
    <div class="glow-blue"></div>
    <div class="glow-red"></div>
    <div class="content">
      <section class="copy">
        <div class="eyebrow">CLIENT EXPERIENCE OVERVIEW</div>
        <h1>ANABOLICS <span>AFRICA</span><br>CUSTOMER FLOW</h1>
        <p class="subtitle">A premium members-only journey designed to take approved customers from discovery to delivery with clarity on every screen.</p>
        <div class="label">DESKTOP + MOBILE EXPERIENCE</div>
      </section>
      <section class="right">
        <div class="browser">
          <div class="browserbar"><span class="dot" style="background:#e11d48"></span><span class="dot" style="background:#f59e0b"></span><span class="dot" style="background:#38bdf8"></span></div>
          <img class="home-img" src="/home/ubuntu/alpha-compound/e2e/visual-baselines.spec.ts-snapshots/public-home-linux.png" alt="Anabolics Africa desktop homepage">
        </div>
        <div class="phone">
          <div class="notch"></div>
          <img class="mobile-img" src="/home/ubuntu/alpha-compound/e2e/visual-baselines.spec.ts-snapshots/mobile-quote-detail-linux.png" alt="Anabolics Africa mobile customer order screen">
        </div>
      </section>
    </div>
    <div class="footer">ANABOLICS AFRICA · CLIENT PRESENTATION · CUSTOMER EXPERIENCE &amp; SALES FLOW</div>
  </div>
</body>
</html>
